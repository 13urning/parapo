name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - if: matrix.app == 'api'
        run: npx prisma generate
      - run: npm run lint
      - if: matrix.app == 'web'
        run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
      - name: Dependency audit (advisory)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: curl -fsS http://localhost:3000/api/v1/health
      - if: always()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
